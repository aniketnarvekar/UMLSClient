name: Swift Package CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3
      # Install Swift (usually pre-installed on macOS runners)
      - name: Ensure Swift version
        run: swift --version

      # Build the package
      - name: Build Swift package
        run: swift build --disable-sandbox

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      # Run tests
      - name: Run tests
        run: doppler run -- swift test
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_CONFIG: ${{ secrets.DOPPLER_CONFIG }}
          DOPPLER_ENVIRONMENT: ${{ secrets.DOPPLER_ENVIRONMENT }}
          DOPPLER_PROJECT: ${{ secrets.DOPPLER_PROJECT  }}
          UMLS_API_KEY: ${{ secrets.UMLS_API_KEY }}
          UMLS_HOST: ${{ secrets.UMLS_HOST }}
          UMLS_VERSION: ${{ secrets.UMLS_HOST  }}
