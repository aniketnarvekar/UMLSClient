name: UMLS REST API Client CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Doppler CLI
        uses: DopplerHQ/cli-action@v1
      # Install Swift (usually pre-installed on macOS runners)
      - name: Ensure Swift version
        run: swift --version

      # Build the package
      - name: Build Swift package
        run: swift build --disable-sandbox

      # Run tests
      - name: Run tests
        run: doppler run -- swift test
